<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" width="1000" height="224" role="img" aria-label="About Ryan Athlawi">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#eceff3" stroke-width="1"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1121f"/><stop offset="100%" stop-color="#9d0208"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1121f" stop-opacity="0"/><stop offset="50%" stop-color="#c1121f" stop-opacity="0.5"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c1121f" stop-opacity="0.16"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c1121f" stop-opacity="1"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1000" height="224" rx="8"/></clipPath>
</defs>
<style>.f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rw{animation:rise .55s ease-out backwards}</style>
<g clip-path="url(#frame)">
<rect width="1000" height="224" fill="#ffffff"/><rect width="1000" height="224" fill="url(#g)"/><circle cx="950" cy="40" r="230" fill="url(#glow)"/><rect x=".5" y=".5" width="999" height="223" rx="8" fill="none" stroke="#d0d7de"/><rect width="5" height="224" fill="url(#bar)"/>
<g transform="rotate(22 920 120.0)"><rect class="st " x="790" y="-100" width="2" height="440" fill="url(#streak)"/><rect class="st st2" x="848" y="-100" width="3" height="440" fill="url(#streak)"/><rect class="st st3" x="910" y="-100" width="2" height="440" fill="url(#streak)"/><rect class="st st4" x="974" y="-100" width="4" height="440" fill="url(#streak)"/><rect class="st st5" x="1036" y="-100" width="2" height="440" fill="url(#streak)"/></g>
<text class="m" x="40" y="44" font-size="14" fill="#57606a">I build desktop tools, game-server systems, and web apps — mostly solo, end to end. My bias is</text>
<text class="m" x="40" y="66" font-size="14" fill="#57606a">toward clean architecture, dark minimal interfaces, and code that is still readable six months</text>
<text class="m" x="40" y="88" font-size="14" fill="#57606a">later.</text>
<g class="rw" style="animation-delay:0.00s"><rect x="40" y="109" width="5" height="5" fill="#c1121f"/><text class="m" x="58" y="118" font-size="14" font-weight="700" fill="#0d1117">Desktop tools</text><text class="m" x="238" y="118" font-size="14" fill="#57606a">Python apps that do one job well — video editing, GTA V asset pipelines</text></g>
<g class="rw" style="animation-delay:0.08s"><rect x="40" y="135" width="5" height="5" fill="#c1121f"/><text class="m" x="58" y="144" font-size="14" font-weight="700" fill="#0d1117">Game development</text><text class="m" x="238" y="144" font-size="14" fill="#57606a">FiveM systems in Lua, React-based NUI, tooling for QBCore / Qbox / ESX</text></g>
<g class="rw" style="animation-delay:0.16s"><rect x="40" y="161" width="5" height="5" fill="#c1121f"/><text class="m" x="58" y="170" font-size="14" font-weight="700" fill="#0d1117">Web</text><text class="m" x="238" y="170" font-size="14" fill="#57606a">Next.js and TypeScript apps, REST APIs, Redis-backed services on Vercel</text></g>
<g class="rw" style="animation-delay:0.24s"><rect x="40" y="187" width="5" height="5" fill="#c1121f"/><text class="m" x="58" y="196" font-size="14" font-weight="700" fill="#0d1117">Developer tooling</text><text class="m" x="238" y="196" font-size="14" fill="#57606a">VS Code extensions, Discord bots, automation for repeated work</text></g>
</g>
</svg>
