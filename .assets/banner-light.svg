<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Ryan Athlawi">
<defs>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
<path d="M34 0H0V34" fill="none" stroke="#eceff3" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#c1121f" stop-opacity="0.16"/>
<stop offset="100%" stop-color="#c1121f" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#c1121f"/>
<stop offset="100%" stop-color="#9d0208"/>
</linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#c1121f" stop-opacity="0"/>
<stop offset="50%" stop-color="#c1121f" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#c1121f" stop-opacity="0"/>
</linearGradient>
<clipPath id="frame"><rect width="1000" height="260" rx="8"/></clipPath>
</defs>
<style>
.f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.ln{opacity:0;animation:cyc 13.5s linear infinite}
.ln2{animation-delay:4.5s}
.ln3{animation-delay:9s}
@keyframes cyc{0%{opacity:0}2%{opacity:1}31%{opacity:1}33%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="260" fill="#ffffff"/>
<rect width="1000" height="260" fill="url(#grid)"/>
<circle cx="905" cy="52" r="250" fill="url(#glow)"/>
<g transform="rotate(22 830 130)">
<rect class="st"  x="700" y="-140" width="2" height="540" fill="url(#streak)"/>
<rect class="st st2" x="758" y="-140" width="3" height="540" fill="url(#streak)"/>
<rect class="st st3" x="820" y="-140" width="2" height="540" fill="url(#streak)"/>
<rect class="st st4" x="884" y="-140" width="4" height="540" fill="url(#streak)"/>
<rect class="st st5" x="946" y="-140" width="2" height="540" fill="url(#streak)"/>
</g>
<rect width="5" height="260" fill="url(#bar)"/>
<text class="m" x="56" y="80" font-size="13" letter-spacing="4.5" fill="#c1121f">// SELF-TAUGHT DEVELOPER</text>
<text class="m" x="944" y="80" font-size="13" letter-spacing="3" fill="#8b949e" text-anchor="end">JEDDAH &#183; SAUDI ARABIA</text>
<text class="f" x="54" y="153" font-size="54" font-weight="700" letter-spacing="5" fill="#0d1117">RYAN ATHLAWI</text>
<rect x="56" y="175" width="108" height="3" fill="#c1121f"/>
<text class="m" x="56" y="217" font-size="18" fill="#57606a">
<tspan class="ln">Building tools, systems, and clean interfaces<tspan class="cur">_</tspan></tspan>
</text>
<text class="m" x="56" y="217" font-size="18" fill="#57606a">
<tspan class="ln ln2">Python &#183; TypeScript &#183; Lua &#183; Go<tspan class="cur">_</tspan></tspan>
</text>
<text class="m" x="56" y="217" font-size="18" fill="#57606a">
<tspan class="ln ln3">Dark UI, minimal design, readable code<tspan class="cur">_</tspan></tspan>
</text>
</g>
</svg>
