<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 232" width="1000" height="232" role="img" aria-label="Tech stack">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#171d25" stroke-width="1"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e5383b"/><stop offset="100%" stop-color="#6a040f"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e5383b" stop-opacity="0"/><stop offset="50%" stop-color="#e5383b" stop-opacity="1"/><stop offset="100%" stop-color="#e5383b" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e5383b" stop-opacity="0.30"/><stop offset="100%" stop-color="#e5383b" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e5383b" stop-opacity="1"/><stop offset="100%" stop-color="#e5383b" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1000" height="232" rx="8"/></clipPath>
</defs>
<style>.f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.it{animation:rise .55s ease-out backwards}</style>
<g clip-path="url(#frame)">
<rect width="1000" height="232" fill="#0d1117"/><rect width="1000" height="232" fill="url(#g)"/><circle cx="940" cy="40" r="230" fill="url(#glow)"/><rect x=".5" y=".5" width="999" height="231" rx="8" fill="none" stroke="#21262d"/><rect width="5" height="232" fill="url(#bar)"/>
<g transform="rotate(22 890 120.0)"><rect class="st " x="760" y="-120" width="2" height="480" fill="url(#streak)"/><rect class="st st2" x="818" y="-120" width="3" height="480" fill="url(#streak)"/><rect class="st st3" x="880" y="-120" width="2" height="480" fill="url(#streak)"/><rect class="st st4" x="944" y="-120" width="4" height="480" fill="url(#streak)"/><rect class="st st5" x="1006" y="-120" width="2" height="480" fill="url(#streak)"/></g>
<text class="m" x="56" y="52" font-size="13" letter-spacing="3.5" fill="#e5383b">LANGUAGES</text>
<rect x="56" y="66" width="46" height="2" fill="#e5383b"/>
<g class="it" style="animation-delay:0.00s"><rect x="56" y="95" width="5" height="5" fill="#e5383b"/><text class="m" x="72" y="104" font-size="15" fill="#8b949e">Python</text></g>
<g class="it" style="animation-delay:0.06s"><rect x="56" y="122" width="5" height="5" fill="#e5383b"/><text class="m" x="72" y="131" font-size="15" fill="#8b949e">TypeScript</text></g>
<g class="it" style="animation-delay:0.12s"><rect x="56" y="149" width="5" height="5" fill="#e5383b"/><text class="m" x="72" y="158" font-size="15" fill="#8b949e">JavaScript</text></g>
<g class="it" style="animation-delay:0.18s"><rect x="56" y="176" width="5" height="5" fill="#e5383b"/><text class="m" x="72" y="185" font-size="15" fill="#8b949e">Lua</text></g>
<g class="it" style="animation-delay:0.24s"><rect x="56" y="203" width="5" height="5" fill="#e5383b"/><text class="m" x="72" y="212" font-size="15" fill="#8b949e">Go</text></g>
<text class="m" x="372" y="52" font-size="13" letter-spacing="3.5" fill="#e5383b">FRAMEWORKS</text>
<rect x="372" y="66" width="46" height="2" fill="#e5383b"/>
<g class="it" style="animation-delay:0.30s"><rect x="372" y="95" width="5" height="5" fill="#e5383b"/><text class="m" x="388" y="104" font-size="15" fill="#8b949e">Node.js</text></g>
<g class="it" style="animation-delay:0.36s"><rect x="372" y="122" width="5" height="5" fill="#e5383b"/><text class="m" x="388" y="131" font-size="15" fill="#8b949e">React</text></g>
<g class="it" style="animation-delay:0.42s"><rect x="372" y="149" width="5" height="5" fill="#e5383b"/><text class="m" x="388" y="158" font-size="15" fill="#8b949e">Next.js</text></g>
<g class="it" style="animation-delay:0.48s"><rect x="372" y="176" width="5" height="5" fill="#e5383b"/><text class="m" x="388" y="185" font-size="15" fill="#8b949e">Express</text></g>
<g class="it" style="animation-delay:0.54s"><rect x="372" y="203" width="5" height="5" fill="#e5383b"/><text class="m" x="388" y="212" font-size="15" fill="#8b949e">Qt</text></g>
<text class="m" x="688" y="52" font-size="13" letter-spacing="3.5" fill="#e5383b">TOOLING</text>
<rect x="688" y="66" width="46" height="2" fill="#e5383b"/>
<g class="it" style="animation-delay:0.60s"><rect x="688" y="95" width="5" height="5" fill="#e5383b"/><text class="m" x="704" y="104" font-size="15" fill="#8b949e">Git</text></g>
<g class="it" style="animation-delay:0.66s"><rect x="688" y="122" width="5" height="5" fill="#e5383b"/><text class="m" x="704" y="131" font-size="15" fill="#8b949e">VS Code</text></g>
<g class="it" style="animation-delay:0.72s"><rect x="688" y="149" width="5" height="5" fill="#e5383b"/><text class="m" x="704" y="158" font-size="15" fill="#8b949e">Vercel</text></g>
<g class="it" style="animation-delay:0.78s"><rect x="688" y="176" width="5" height="5" fill="#e5383b"/><text class="m" x="704" y="185" font-size="15" fill="#8b949e">Redis</text></g>
<g class="it" style="animation-delay:0.84s"><rect x="688" y="203" width="5" height="5" fill="#e5383b"/><text class="m" x="704" y="212" font-size="15" fill="#8b949e">Discord.js</text></g>
</g>
</svg>
