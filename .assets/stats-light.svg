<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="GitHub statistics">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#eceff3" stroke-width="1"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1121f"/><stop offset="100%" stop-color="#9d0208"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1121f" stop-opacity="0"/><stop offset="50%" stop-color="#c1121f" stop-opacity="0.5"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c1121f" stop-opacity="0.16"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c1121f" stop-opacity="1"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1000" height="176" rx="8"/></clipPath>
</defs>
<style>.f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.un{animation:grow 1.1s ease-out backwards}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.nb{animation:rise .7s ease-out backwards}</style>
<g clip-path="url(#frame)">
<rect width="1000" height="176" fill="#ffffff"/><rect width="1000" height="176" fill="url(#g)"/><circle cx="900" cy="40" r="230" fill="url(#glow)"/><rect x=".5" y=".5" width="999" height="175" rx="8" fill="none" stroke="#d0d7de"/><rect width="5" height="176" fill="url(#bar)"/>
<g transform="rotate(22 900 110.0)"><rect class="st " x="770" y="-80" width="2" height="380" fill="url(#streak)"/><rect class="st st2" x="828" y="-80" width="3" height="380" fill="url(#streak)"/><rect class="st st3" x="890" y="-80" width="2" height="380" fill="url(#streak)"/><rect class="st st4" x="954" y="-80" width="4" height="380" fill="url(#streak)"/><rect class="st st5" x="1016" y="-80" width="2" height="380" fill="url(#streak)"/></g>
<text class="m" x="40" y="42" font-size="13" letter-spacing="3.5" fill="#c1121f">// LAST 12 MONTHS</text>
<g class="nb" style="animation-delay:0.00s"><text class="f" x="132.0" y="116" font-size="40" font-weight="700" fill="#0d1117" text-anchor="middle">311</text><text class="m" x="132.0" y="138" font-size="11" letter-spacing="2" fill="#8b949e" text-anchor="middle">CONTRIBUTIONS</text></g>
<rect class="un" x="115.0" y="150" width="34" height="2.5" fill="#c1121f" style="animation-delay:0.00s;transform-origin:132.0px 0"/>
<rect x="224.0" y="70" width="1" height="74" fill="#d0d7de"/>
<g class="nb" style="animation-delay:0.10s"><text class="f" x="316.0" y="116" font-size="40" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text class="m" x="316.0" y="138" font-size="11" letter-spacing="2" fill="#8b949e" text-anchor="middle">CURRENT STREAK</text></g>
<rect class="un" x="299.0" y="150" width="34" height="2.5" fill="#c1121f" style="animation-delay:0.10s;transform-origin:316.0px 0"/>
<rect x="408.0" y="70" width="1" height="74" fill="#d0d7de"/>
<g class="nb" style="animation-delay:0.20s"><text class="f" x="500.0" y="116" font-size="40" font-weight="700" fill="#0d1117" text-anchor="middle">6</text><text class="m" x="500.0" y="138" font-size="11" letter-spacing="2" fill="#8b949e" text-anchor="middle">LONGEST STREAK</text></g>
<rect class="un" x="483.0" y="150" width="34" height="2.5" fill="#c1121f" style="animation-delay:0.20s;transform-origin:500.0px 0"/>
<rect x="592.0" y="70" width="1" height="74" fill="#d0d7de"/>
<g class="nb" style="animation-delay:0.30s"><text class="f" x="684.0" y="116" font-size="40" font-weight="700" fill="#0d1117" text-anchor="middle">4</text><text class="m" x="684.0" y="138" font-size="11" letter-spacing="2" fill="#8b949e" text-anchor="middle">PUBLIC REPOS</text></g>
<rect class="un" x="667.0" y="150" width="34" height="2.5" fill="#c1121f" style="animation-delay:0.30s;transform-origin:684.0px 0"/>
<rect x="776.0" y="70" width="1" height="74" fill="#d0d7de"/>
<g class="nb" style="animation-delay:0.40s"><text class="f" x="868.0" y="116" font-size="40" font-weight="700" fill="#0d1117" text-anchor="middle">6</text><text class="m" x="868.0" y="138" font-size="11" letter-spacing="2" fill="#8b949e" text-anchor="middle">TOTAL STARS</text></g>
<rect class="un" x="851.0" y="150" width="34" height="2.5" fill="#c1121f" style="animation-delay:0.40s;transform-origin:868.0px 0"/>
</g>
</svg>
