<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e5383b"/><stop offset="100%" stop-color="#6a040f"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e5383b" stop-opacity="0"/><stop offset="50%" stop-color="#e5383b" stop-opacity="1"/><stop offset="100%" stop-color="#e5383b" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e5383b" stop-opacity="0.30"/><stop offset="100%" stop-color="#e5383b" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e5383b" stop-opacity="1"/><stop offset="100%" stop-color="#e5383b" stop-opacity="0"/></linearGradient>
