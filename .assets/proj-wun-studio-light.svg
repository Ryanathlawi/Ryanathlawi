<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" width="1000" height="104" role="img" aria-label="wun-studio: GTA V and FiveM toolkit — YTD texture editing, clothing validator…">
<defs>
<pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#eceff3" stroke-width="1"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1121f"/><stop offset="100%" stop-color="#9d0208"/></linearGradient>
<linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c1121f" stop-opacity="0"/><stop offset="50%" stop-color="#c1121f" stop-opacity="0.5"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c1121f" stop-opacity="0.16"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c1121f" stop-opacity="1"/><stop offset="100%" stop-color="#c1121f" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1000" height="104" rx="8"/></clipPath>
</defs>
<style>.f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.st{animation:sh 7s ease-in-out infinite}
.st2{animation-delay:.9s}.st3{animation-delay:1.8s}.st4{animation-delay:2.7s}.st5{animation-delay:3.6s}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.ar{animation:slide 2.6s ease-in-out infinite}@keyframes slide{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(6px);opacity:1}}</style>
<g clip-path="url(#frame)">
<rect width="1000" height="104" fill="#ffffff"/><rect width="1000" height="104" fill="url(#g)"/><circle cx="1010" cy="40" r="230" fill="url(#glow)"/><rect x=".5" y=".5" width="999" height="103" rx="8" fill="none" stroke="#d0d7de"/><rect width="5" height="104" fill="url(#bar)"/>
<g transform="rotate(22 1022 70.0)"><rect class="st " x="892" y="-60" width="2" height="260" fill="url(#streak)"/><rect class="st st2" x="950" y="-60" width="3" height="260" fill="url(#streak)"/><rect class="st st3" x="1012" y="-60" width="2" height="260" fill="url(#streak)"/><rect class="st st4" x="1076" y="-60" width="4" height="260" fill="url(#streak)"/><rect class="st st5" x="1138" y="-60" width="2" height="260" fill="url(#streak)"/></g>
<text class="m" x="40" y="42" font-size="12" letter-spacing="3" fill="#8b949e">01</text>
<text class="m" x="76" y="44" font-size="21" font-weight="700" fill="#0d1117">wun-studio</text>
<text class="m" x="76" y="72" font-size="14" fill="#57606a">GTA V and FiveM toolkit — YTD texture editing, clothing validator…</text>
<path class="ar" d="M934 44h16m-6-6 6 6-6 6" fill="none" stroke="#c1121f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="828" cy="68" r="5" fill="#3572A5"/>
<text class="m" x="840" y="73" font-size="13" fill="#57606a">Python</text>
<path d="M914 63.5l2.2 4.4 4.9.7-3.6 3.4.9 4.8-4.4-2.3-4.4 2.3.9-4.8-3.6-3.4 4.9-.7z" fill="#c1121f"/>
<text class="m" x="956" y="73" font-size="13" fill="#57606a" text-anchor="end">3</text>
</g>
</svg>
